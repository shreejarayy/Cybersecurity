# Full stack matching the report: API, scheduler, PostgreSQL, Redis.
# For a zero-setup demo you can skip this and run `python main.py --target 127.0.0.1 --no-db`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus
      REDIS_URL: redis://redis:6379/0
    env_file: [.env]
    ports: ["8050:8050"]
    depends_on: [postgres, redis]
    command: python -m argus.api.app

  scheduler:
    build: .
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres:5432/argus
    env_file: [.env]
    depends_on: [postgres, redis]
    command: python -m argus.scheduler

volumes:
  pgdata:
